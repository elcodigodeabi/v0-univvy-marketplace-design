  <!-- Top brim - left -->
  <path d="M30 60L65 85" stroke="#FF3E3E" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Top brim - right -->
  <path d="M170 60L135 85" stroke="#FF3E3E" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Middle band -->
  <path d="M65 85L135 85" stroke="#FF3E3E" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left side tube -->
  <path d="M75 85L75 160" stroke="#FF3E3E" stroke-width="16" fill="none" stroke-linecap="round"/>
  
  <!-- Right side tube -->
  <path d="M125 85L125 160" stroke="#FF3E3E" stroke-width="16" fill="none" stroke-linecap="round"/>
  
